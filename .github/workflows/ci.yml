name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: example
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install Docker Compose
      run: ./scripts/install_docker_compose.sh

    - name: Build frontend
      run: ./scripts/build_frontend.sh

    - name: Build backend
      run: ./scripts/build_backend.sh

    - name: Start database and backend services
      run: ./scripts/start_services.sh

    - name: Wait for database to be ready
      run: ./scripts/wait_for_db.sh

    - name: Check running containers
      run: ./scripts/check_containers.sh

    - name: View backend logs (if running)
      run: ./scripts/view_backend_logs.sh

    - name: Run backend health check
      run: ./scripts/health_check.sh

    - name: Log in to GitHub Container Registry
      run: ./scripts/login_ghcr.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}

    - name: Tag backend image for GHCR
      run: ./scripts/tag_backend_image.sh
      env:
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

    - name: Push backend image to GHCR
      run: ./scripts/push_backend_image.sh
      env:
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Lint Placeholder
      run: echo "Linting would go here..."

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - name: Test Placeholder
      run: echo "Tests would run here..."

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Security Scan Placeholder
      run: echo "Security scan would go here..."

  deploy:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
    - name: Deployment Placeholder
      run: echo "Deployment step would go here..."
